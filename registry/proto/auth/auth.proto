syntax = "proto3";

package registry.proto.auth;

import "google/protobuf/empty.proto";

option go_package = "github.com/uddinArsalan/ferry-registry/proto/auth";

service AuthService{
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Refresh(google.protobuf.Empty) returns (LoginResponse);
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
    string access_token_expires_at = 3;
    string refresh_token_expires_at = 4;
}